name: Continuous Integration & Model Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r requirements.txt

      - name: Static Analysis & Code Linting (Ruff)
        run: |
          ruff check src/ tests/

      - name: Execute Pytest Suite (Data Pipeline, API Inference, Drift)
        run: |
          pytest tests/test_data_pipeline.py tests/test_model_inference.py tests/test_drift.py -v

      - name: Verify Model Evaluation Performance Gate
        run: |
          pytest tests/test_model_eval_gate.py -v