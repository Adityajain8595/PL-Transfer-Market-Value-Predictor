name: Continuous Integration & Model Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r requirements.txt
          pip install -e .

      - name: Static Analysis & Code Linting (Ruff)
        run: |
          ruff check src/ tests/

      - name: Execute Pytest Suite (Data Pipeline)
        run: |
          python -m pytest tests/test_data_pipeline.py -v

      - name: Execute Pytest Suite (API Inference)
        run: |
          python -m pytest tests/test_model_inference.py -v

      - name: Execute Pytest Suite (Drift Monitoring)
        run: |
          python -m pytest tests/test_drift.py -v

      - name: Verify Model Evaluation Performance Gate
        run: |
          python -m pytest tests/test_model_eval_gate.py -v