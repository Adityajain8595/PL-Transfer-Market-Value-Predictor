mlflow:
  experiment_name: "PL_Market_Value_Enterprise"
  registered_model_name: "pl-market-value-regressor"
  use_dagshub: true
  dagshub_repo_owner: "Adityajain8595"   
  dagshub_repo_name: "PL-Transfer-Market-Predictor"

models:
  LightGBM:
    objective: "regression_l1"
    n_estimators: 250
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42
    verbose: -1
    n_jobs: -1
  XGBoost:
    objective: "reg:absoluteerror"
    n_estimators: 250
    learning_rate: 0.05
    max_depth: 6
    random_state: 42
    verbosity: 0
    n_jobs: -1
  CatBoost:
    loss_function: "MAE"
    iterations: 250
    learning_rate: 0.05
    depth: 6
    random_seed: 42
    verbose: false
  RandomForest:
    n_estimators: 150
    max_depth: 12
    random_state: 42
    n_jobs: -1
  GradientBoosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 5
    random_state: 42